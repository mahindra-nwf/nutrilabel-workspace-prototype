<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriLabel Workspace</title>
  <link rel="stylesheet" href="base.css?v=202610161120">
  <link rel="stylesheet" href="workspace.css?v=202610161120">
  <script>try { var t = JSON.parse(localStorage.getItem('nlws.pref.theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-layout>
  <header class="topbar" id="topbar"></header>
  <div class="ws-shell">
    <aside class="ws-side" id="sidebar"></aside>
    <main class="ws-main">
      <div class="ws-head">
        <div class="ws-crumbs" id="crumbs"></div>
        <div class="ws-selbar" id="selbar" hidden></div>
        <div class="ws-head-tools" id="headTools"></div>
      </div>
      <div class="ws-filters" id="filters" hidden></div>
      <div class="ws-items" id="items"></div>
    </main>
    <aside class="ws-details" id="details" hidden aria-label="Details"></aside>
    <aside class="ws-demo" id="demo" hidden aria-label="Use cases guide"></aside>
  </div>

  <!-- classic scripts (not modules) so the page also works when opened straight from disk -->
  <script src="store.js?v=202610161120"></script>
  <script src="ui.js?v=202610161120"></script>
  <script src="people-menu.js?v=202610161120"></script>
  <script src="notifications.js?v=202610161120"></script>
  <script src="scenarios.js?v=202610161120"></script>
  <script src="demo-panel.js?v=202610161120"></script>
  <script src="toolbar.js?v=202610161120"></script>
  <script src="sidebar.js?v=202610161120"></script>
  <script src="breadcrumbs.js?v=202610161120"></script>
  <script src="new-menu.js?v=202610161120"></script>
  <script src="tag-editor.js?v=202610161120"></script>
  <script src="tag-filters.js?v=202610161120"></script>
  <script src="tag-admin.js?v=202610161120"></script>
  <script src="item-menu.js?v=202610161120"></script>
  <script src="item-grid.js?v=202610161120"></script>
  <script src="item-list.js?v=202610161120"></script>
  <script src="details-panel.js?v=202610161120"></script>
  <script src="share-dialog.js?v=202610161120"></script>
  <script src="move-dialog.js?v=202610161120"></script>
  <script src="app.js?v=202610161120"></script>
</body>
</html>
